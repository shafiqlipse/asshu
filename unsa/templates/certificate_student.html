<html lang="en">
  {% load static %}
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Album</title>
  </head>

  <body>
    <style>
      @page {
        size: A4 portrait;
        margin: 0;
         /*background-image: url("https://asshu.edu.ug/cert.jpg");*/
      }
      body {
        margin: 0;
        padding: 0;
      }
      .student-table {
        width: 100%;
        border-collapse: collapse;
      }
      .header .students table tbody tr td {
        padding-top: 290px;
        margin-left: 120px;
        padding-right: 10px;
        text-align: center;
      }
      .header .students table tbody tr .student-cell .student-info span {
        font-size: 1.2em;
      }
      .header .students table tbody tr .student-cell .student-info .name {
        font-size: 2em;
        font-weight: bold;
        font-family: Geneva;
        font-style: italic;
      }
      .header .students table tbody tr .student-cell .student-image img {
        width: 120px;
        height: 120px;
        image-orientation: from-image;
        transform: rotate(0deg);
      }
    </style>
    <div class="header">
      <div class="students">
        <table class="student-table">
          <tbody>
            {% for student in students %}
            <tr>
              <td class="student-cell">
                <div class="student-info">
                  <span class="name"
                    ><strong
                      >{{ student.first_name|upper }} {{student.last_name|upper}}
                    </strong></span
                  ><br />

                  <span>{{ student.designation|upper }}</span><br />
                  <span>{{ student.school|upper }}</span><br />
                  <span>{{ student.district|upper }} </span><br />
                </div>
              </td>
              <td class="student-cell">
                <div class="student-image">
                  {% if student.photo %}
                  <img
                    src="{{ student.photo.path }}"
                    alt="{{ student.first_name }}"
                  />
                  {% else %}
                  <img
                    src="{% static 'images/profile.png' %}"
                    alt="{{ student.last_name }}"
                  />
                  {% endif %}
                </div>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
